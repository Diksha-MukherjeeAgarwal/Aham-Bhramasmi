    <title>Earth Jukebox: Change Mode</title>
    <script>
      // Pre-paint accessibility boot. Keep these queries in sync with
      // src/storage.js. This only applies the saved accessibility preference
      // and the supported OS media queries; React takes over after mount.
      (function () {
        try {
          var key = 'earth-jukebox-accessibility';
          var saved = null;
          try {
            saved = window.localStorage.getItem(key);
          } catch (_) {
            // Storage may be blocked; fall through to the media queries.
          }
          var on = false;
          if (saved === 'on') {
            on = true;
          } else if (saved !== 'off') {
            var queries = [
              '(forced-colors: active)',
              '(prefers-contrast: more)',
              '(inverted-colors: inverted)',
              '(prefers-reduced-transparency: reduce)',
              '(prefers-reduced-motion: reduce)'
            ];
            for (var i = 0; i < queries.length; i += 1) {
              try {
                if (window.matchMedia(queries[i]).matches) { on = true; break; }
              } catch (_) {
                // Unsupported media features do not match.
              }
            }
          }
          if (on) document.documentElement.classList.add('a11y-boot');
        } catch (_) {
          // A failed boot check must never block the app.
        }
      })();
    </script>
    <style>
      /* Critical pre-paint background: matches the normal theme before styles.css loads. */
      html {
        background: #06090d;
      }

      @media (prefers-color-scheme: light) {
        html {
          background: #eef1f4;
        }
      }

      /* Accessibility boot wins over both so the first paint is never bright. */
      html.a11y-boot,
      html.a11y-boot body {
        background: #000;
        background-image: none;
        color: #fff;
      }
    </style>
  </head>

  </body>
